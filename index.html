    '<button class="btn danger" id="off">이날 레슨 없음 (모두)</button>'+
    (lt.changed?'<button class="btn" id="undo">시간 원래대로</button>':'')+
    '<button class="btn ghost" data-close>닫기</button></div>';
  openSheet(h, function(bg, close){
    bg.querySelector("#save").onclick=function(){
      var tm=readTimes(bg,true); if(!tm) return;
      if(!tm.e){ bg.querySelector(".err").textContent="레슨 끝 시간을 넣어 주세요."; return; }
      var home=bg.querySelector("#sh_h").value;
      if(home && mins(home)<mins(tm.e)){ bg.querySelector(".err").textContent="귀가 시간은 레슨이 끝난 뒤여야 해요."; return; }
      if(tm.s===S.lesson.start && tm.e===S.lesson.end && home===(S.lesson.home||"")) ovSet(ds,"lesson",null);
      else ovSet(ds,"lesson",{s:tm.s, e:tm.e, home:home});

    };

    var un=bg.querySelector("#undo"); if(un) un.onclick=function(){ ovSet(ds,"lesson",null); close(); afterChange("레슨 시간을 원래대로 돌렸어요"); };
    bg.querySelector("#off").onclick=function(){

        delete S.lessonDays[ds]; ovSet(ds,"lesson",null); S.lesson.kids.forEach(function(id){ ovSet(ds,"lesson:"+id,null); }); afterChange("이날 레슨을 뺐어요"); }, true);
    };
  });
}

/* 특별 일정: 새로 추가 / 고치기 */
function quickTitles(kidId){
  var set={}, out=[];
  var ids = personById(kidId) ? [kidId] : S.kids.map(function(k){return k.id;});
  ids.forEach(function(id){ Object.keys(S.fixed[id]||{}).forEach(function(d){ (S.fixed[id][d]||[]).forEach(function(it){ if(it.title!=="하교" && !it.work && !set[it.title]){ set[it.title]=1; out.push(it.title+" 보강"); } }); }); });
  return out.slice(0,6);
}
function whoChips(cur){
  var opts=[["all","가족 모두"]].concat(S.kids.map(function(k){return [k.id,k.name];})).concat([["아빠","아빠"],["엄마","엄마"]]);
  return '<div class="who" id="who">'+opts.map(function(o){ return '<button class="chip'+(o[0]===cur?' on':'')+'" data-who="'+esc(o[0])+'">'+esc(o[1])+'</button>'; }).join("")+'</div>';
}
function eventForm(ev, title){
  var q=quickTitles(ev.who);
  return '<h3>'+title+'</h3>'+
    '<label class="f">누구 일정인가요?</label>'+whoChips(ev.who)+
    '<label class="f" for="sh_t">내용</label><input type="text" id="sh_t" value="'+esc(ev.title||"")+'" placeholder="영어 보강, 학교 공개수업, 치과" maxlength="40">'+
    (q.length?'<div class="qchips" id="qc">'+q.map(function(t){return '<button class="chip" data-q="'+esc(t)+'">'+esc(t)+'</button>';}).join("")+'</div>':'')+
    '<label class="f" for="sh_d">날짜</label><input type="date" id="sh_d" value="'+esc(ev.date)+'">'+
    timePicker(ev.s, ev.e, {label:"시간", opt:true})+
    '<div class="err"></div>';
}
function bindEventForm(bg, state){
  each("#who .chip",function(c){ c.onclick=function(){ state.who=c.getAttribute("data-who"); each("#who .chip",function(x){ x.classList.toggle("on",x===c); }, bg); }; }, bg);
  each("#qc .chip",function(c){ c.onclick=function(){ bg.querySelector("#sh_t").value=c.getAttribute("data-q"); bg.querySelector(".err").textContent=""; }; }, bg);
}
function readEvent(bg, state){
  var t=bg.querySelector("#sh_t").value.trim(), d=bg.querySelector("#sh_d").value, er=bg.querySelector(".err");
  if(!t){ er.textContent="내용을 입력해 주세요."; return null; }
  if(!d){ er.textContent="날짜를 골라 주세요."; return null; }
  var tm=readTimes(bg,false); if(!tm) return null;
  return {title:t, date:d, s:tm.s, e:tm.e, who:state.who};
}
function openNewEventSheet(ds, who, fromTab){
  var state={who:who||"all"};
  var h=eventForm({who:state.who, date:ds, s:"", e:"", title:""}, "일정 추가")+
    '<div class="note">보강처럼 원래 수업이 다른 날로 옮겨지면, 원래 날짜의 수업을 눌러 "이날 휴강"도 함께 해 주세요.</div>'+
    '<div class="stack"><button class="btn pri" id="save">추가</button><button class="btn ghost" data-close>닫기</button></div>';
  openSheet(h, function(bg, close){
    bindEventForm(bg, state);
    bg.querySelector("#save").onclick=function(){
      var ev=readEvent(bg, state); if(!ev) return;
      ev.id=uid(); S.events.push(ev); close();
      if(!fromTab) view.day=ev.date;
      afterChange(ev.date===ds?"추가했어요":dateLabel(ev.date)+"에 추가했어요");
    };
  });
}
function openEventSheet(id){
  var ev=findEvent(id); if(!ev) return;
  var state={who:ev.who};
  var h=eventForm(ev, "일정 고치기")+
    '<div class="stack"><button class="btn pri" id="save">저장</button><button class="btn danger" id="del">삭제</button><button class="btn ghost" data-close>닫기</button></div>';
  openSheet(h, function(bg, close){
    bindEventForm(bg, state);
    bg.querySelector("#save").onclick=function(){
      var n=readEvent(bg, state); if(!n) return;
      Object.assign(ev, n); close(); afterChange("저장했어요");
    };
    bg.querySelector("#del").onclick=function(){
      close();
      confirmBox("일정을 지울까요?", dateLabel(ev.date)+" · "+ev.title, "지우기", function(){ S.events=S.events.filter(function(x){return x.id!==id;}); afterChange("지웠어요"); }, true);
    };
  });
}

/* 설정 > 고정 시간표 고치기 */
function openWeeklySheet(kidId, dow, id){
  var k=personById(kidId), isNew=!id, it=isNew?{title:"",s:"",e:""}:fixedBase(kidId,dow,id);
  if(!it) return;
  var h='<h3>'+esc(k.name)+' · 매주 '+DOW[dow]+'요일</h3><div class="sub">'+(isNew?'고정 일정 추가':'고정 일정 고치기')+'</div>'+
    '<label class="f" for="sh_t">내용</label><input type="text" id="sh_t" value="'+esc(it.title)+'" placeholder="영어, 큰빛, 축구, 하교" maxlength="20">'+
    timePicker(it.s, it.e, {label:"시간 (하교는 길이 \'끝 없음\')"})+'<div class="err"></div>'+
    '<div class="stack"><button class="btn pri" id="save">'+(isNew?'추가':'저장')+'</button>'+(isNew?'':'<button class="btn danger" id="del">매주 일정에서 삭제</button>')+'<button class="btn ghost" data-close>닫기</button></div>';
  openSheet(h, function(bg, close){
    bg.querySelector("#save").onclick=function(){
      var tm=readTimes(bg,true); if(!tm) return;
      var t=bg.querySelector("#sh_t").value.trim(); if(!t){ bg.querySelector(".err").textContent="내용을 입력해 주세요."; return; }
      if(isNew){ S.fixed[kidId]=S.fixed[kidId]||{}; S.fixed[kidId][dow]=S.fixed[kidId][dow]||[]; S.fixed[kidId][dow].push({id:uid(), s:tm.s, e:tm.e, title:t}); }
      else { it.title=t; it.s=tm.s; it.e=tm.e; }
      close(); afterChange(isNew?"추가했어요":"저장했어요");
    };
    var d=bg.querySelector("#del"); if(d) d.onclick=function(){
      close();
      confirmBox("고정 일정을 지울까요?", "매주 "+DOW[dow]+"요일 "+it.title+" 일정이 빠져요.", "지우기", function(){
        S.fixed[kidId][dow]=S.fixed[kidId][dow].filter(function(x){return x.id!==id;});
        Object.keys(S.overrides).forEach(function(ds){ ovSet(ds,id,null); });
        afterChange("지웠어요"); }, true);
    };
  });
}

  $("logout").onclick=function(){
    confirmBox("로그아웃할까요?", "다시 보려면 구글 로그인이 필요해요. 일정은 그대로 남아 있어요.", "로그아웃", function(){
      try{ localStorage.removeItem(KEY); }catch(e){} S=null; setPhoto("", false); view.tab="today"; if(cloud.signOut) cloud.signOut(); }, false);
  };
}
function openDetails(i){ var ds=document.querySelectorAll("details.set"); if(ds[i]){ ds[0].open=false; ds[i].open=true; } }
function copyText(text, msg){
  var fb=function(){
    var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="absolute"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(msg); }catch(e){ toast("복사가 안 돼요. 길게 눌러 직접 복사해 주세요"); }
    ta.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(msg); }, fb); else fb();
}

/* ---------- 탭·자동 새로고침 ---------- */
each("#tabs button",function(b){
  b.onclick=function(){ var t=b.getAttribute("data-tab"); if(t==="today") view.day=todayStr(); if(t!=="month") view.mLes=false; if(t==="week") view.weekBase=null; view.tab=t; render(); };
});
function canRefresh(){ var a=document.activeElement; return S && view.tab==="today" && !isModalOpen() && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
document.addEventListener("visibilitychange",function(){ if(!document.hidden && canRefresh()) render(true); });
setInterval(function(){ if(!document.hidden && canRefresh()) render(true); }, 60000);

/* ---------- 링크로 시간표 받기 (#FAM1:...) ---------- */
function clearHash(){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; } }
(function(){
  var h=""; try{ h=location.hash ? decodeURIComponent(location.hash.slice(1)) : ""; }catch(e){ h=location.hash.slice(1); }
  if(h.indexOf("ADD1:")===0){
    clearHash();
    try{ var a=JSON.parse(decodeURIComponent(escape(atob(h.slice(5).replace(/\s+/g,""))))); pendingAdd=Array.isArray(a.periods)?a.periods:null; }
    catch(e){ setTimeout(function(){ toast("링크의 일정을 읽지 못했어요"); },300); }
    return;
  }
  if(h.indexOf("FAM1:")!==0) return;
  var o; try{ o=decodeCode(h); }catch(e){ clearHash(); setTimeout(function(){ toast("링크의 코드를 읽지 못했어요"); },300); return; }
  clearHash();
  if(!S){ S=o; save(); setTimeout(function(){ toast("시간표를 불러왔어요"); },300); return; }
  setTimeout(function(){
    confirmBox("새 시간표로 바꿀까요?", "링크에 담긴 시간표로 가족 일정 전체를 덮어써요.", "바꾸기", function(){ S=o; save(); view.tab="today"; render(); toast("시간표를 불러왔어요"); }, true);
  },200);
})();

window.addEventListener("hashchange",function(){ var h=location.hash.slice(1); if(h.indexOf("ADD1:")===0||h.indexOf("FAM1:")===0) location.reload(); });
applyBackdrop();
render();
startCloud();
})();
</script>
